services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claims}
      POSTGRES_DB: ${POSTGRES_DB:-claims_manager}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claims} -d ${POSTGRES_DB:-claims_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-TENNET}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://claims:claims@db:5432/claims_manager}
      LOCAL_STORAGE_DIR: /app/storage
      EVIDENCE_STORAGE_BACKEND: ${EVIDENCE_STORAGE_BACKEND:-local}
      EVIDENCE_STORAGE_DIR: ${EVIDENCE_STORAGE_DIR:-/app/data/evidence}
      MAX_EVIDENCE_FILE_SIZE_MB: ${MAX_EVIDENCE_FILE_SIZE_MB:-15}
      IMPORT_MAX_FILE_SIZE_MB: ${IMPORT_MAX_FILE_SIZE_MB:-10}
      IMPORT_STORAGE_DIR: ${IMPORT_STORAGE_DIR:-/app/data/imports}
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-10000}
      REPORT_DEFAULT_LOOKBACK_DAYS: ${REPORT_DEFAULT_LOOKBACK_DAYS:-90}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/storage:/app/storage
      - ./data/evidence:/app/data/evidence
      - ./data/imports:/app/data/imports
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:

