name: CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: claims
          POSTGRES_DB: claims_manager
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U claims -d claims_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://claims:claims@localhost:5432/claims_manager
      LOCAL_STORAGE_DIR: storage
      BACKEND_CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Compile imports
        run: python -m compileall -q app

      - name: Apply migrations
        run: alembic upgrade head

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

      - name: Validate production compose file
        run: PRODUCTION_ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f docker-compose.prod.yml config

      - name: Build images
        run: docker compose build

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic scans
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          ignored_dirs = {".git", ".next", ".venv", "node_modules", "venv", "work"}
          ignored_files = {".github/workflows/ci.yml", "frontend/package-lock.json"}
          text_suffixes = {
              ".css",
              ".env",
              ".example",
              ".ini",
              ".js",
              ".json",
              ".md",
              ".mjs",
              ".py",
              ".toml",
              ".ts",
              ".tsx",
              ".txt",
              ".yml",
              ".yaml",
          }

          def iter_files():
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  parts = set(path.parts)
                  if parts & ignored_dirs:
                      continue
                  normalized = path.as_posix()
                  if normalized in ignored_files:
                      continue
                  if path.suffix.lower() not in text_suffixes and path.name != ".env.example":
                      continue
                  yield path

          domain_pattern = re.compile(
              r"\b(fitness|coach|wearable|wearables|imc|nutrition|sport|sante|sant\u00e9|atlas)\b",
              re.IGNORECASE,
          )
          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |)?PRIVATE KEY-----"),
              re.compile(r"\b(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,})\b"),
              re.compile(
                  r"(?i)\b(api[_-]?key|client[_-]?secret|private[_-]?key|bearer)\b"
                  r"\s*[:=]\s*[\"']?[A-Za-z0-9_./+=-]{24,}"
              ),
          ]

          domain_hits = []
          secret_hits = []
          for path in iter_files():
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  content = path.read_text(encoding="utf-8", errors="ignore")
              for line_number, line in enumerate(content.splitlines(), start=1):
                  if domain_pattern.search(line):
                      domain_hits.append(f"{path}:{line_number}: domain drift keyword")
                  if any(pattern.search(line) for pattern in secret_patterns):
                      secret_hits.append(f"{path}:{line_number}: possible secret")

          if domain_hits or secret_hits:
              for hit in domain_hits + secret_hits:
                  print(hit)
              sys.exit(1)

          print("Basic quality scans passed.")
          PY

      - name: Validate shell scripts
        run: bash -n scripts/*.sh
