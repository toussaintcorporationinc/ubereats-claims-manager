name: TENNET self-heal CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/app/services/autopilot_service.py'
      - 'backend/app/services/gmail_email_provider.py'
      - 'backend/app/services/customer_refund_autopilot_service.py'
      - 'backend/app/services/uber_reporting_import_service.py'
      - 'backend/app/routes/runtime.py'
      - 'backend/app/routes/uber.py'
      - 'backend/app/services/uber_connector_service.py'
      - 'backend/tests/test_uber_live_connector.py'
      - 'backend/tests/test_autopilot.py'
      - '.github/workflows/tennet-self-heal-ci.yml'

permissions:
  contents: read

concurrency:
  group: tennet-self-heal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-heal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run TENNET self-heal regression tests
        run: |
          pytest -q \
            tests/test_autopilot.py::test_followup_self_heal_requeues_legacy_gmail_quota_failure \
            tests/test_autopilot.py::test_followup_self_heal_completes_task_when_gmail_send_is_already_confirmed \
            tests/test_autopilot.py::test_followup_self_heal_recovers_missing_gmail_thread_from_exact_order_id \
            tests/test_autopilot.py::test_followup_self_heal_resets_quota_failure_when_remote_draft_was_never_created \
            tests/test_autopilot.py::test_followup_self_heal_confirms_stale_send_requested_from_real_gmail_history \
            tests/test_autopilot.py::test_autopilot_appeal_requires_verified_gmail_thread \
            tests/test_autopilot.py::test_appeal_candidates_do_not_starve_eligible_cases_behind_blocked_ones \
            tests/test_autopilot.py::test_autopilot_sends_appeal_from_verified_unstarred_uber_reply \
            tests/test_autopilot.py::test_customer_refund_autopilot_sends_ready_dispute \
            tests/test_uber_live_connector.py::test_uber_connector_credentials_and_signature \
            tests/test_uber_live_connector.py::test_uber_oauth_url_is_passive_setup_ready \
            tests/test_uber_live_connector.py::test_uber_cancellation_webhook_captures_snapshot_and_provisional_claim \
            tests/test_uber_live_connector.py::test_uber_poll_worker_is_safe_with_no_mapped_stores
