name: TENNET Uber worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tennet-uber-worker.yml'
      - 'backend/app/services/uber_connector_service.py'
      - 'backend/app/routes/runtime.py'

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: tennet-uber-worker
  cancel-in-progress: false

jobs:
  uber:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Poll Uber cancellations every three minutes
        shell: bash
        run: |
          set -u

          for tick in $(seq 1 10); do
            echo "TENNET Uber tick ${tick}/10"

            oidc_json="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tennet-runtime")" || {
                echo "Unable to mint OIDC token for this tick" >&2
                if [ "$tick" -lt 10 ]; then sleep 180; fi
                continue
              }

            runtime_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_json")"
            echo "::add-mask::$runtime_token"

            status="$(curl --silent --show-error --request POST \
              --header "Authorization: Bearer ${runtime_token}" \
              --header "Accept: application/json" \
              --output response.json \
              --write-out "%{http_code}" \
              "https://ubereats-claims-manager.vercel.app/api/v1/runtime/uber-worker" || true)"

            cat response.json 2>/dev/null || true
            echo
            echo "TENNET Uber runtime HTTP ${status}"

            if [ "$tick" -lt 10 ]; then
              sleep 180
            fi
          done

      - name: Re-arm TENNET Uber worker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tennet-uber-worker.yml/dispatches" \
            --data '{"ref":"main"}'
