name: TENNET Gmail history backfill
# Recovery trigger: retry bounded historical Gmail import with production failure diagnostics.

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tennet-gmail-backfill.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tennet-gmail-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Drain two historical Uber Gmail slices
        shell: bash
        run: |
          set -u

          quota_deferred=0
          for tick in 1 2; do
            echo "TENNET Gmail historical backfill ${tick}/2"

            oidc_json="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tennet-runtime")" || exit 1

            runtime_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_json")"
            echo "::add-mask::$runtime_token"

            status="$(curl --silent --show-error --request POST \
              --header "Authorization: Bearer ${runtime_token}" \
              --header "Accept: application/json" \
              --output response.json \
              --write-out "%{http_code}" \
              "https://ubereats-claims-manager.vercel.app/api/v1/runtime/gmail-backfill" || true)"

            cat response.json 2>/dev/null || true
            echo
            echo "TENNET backfill runtime HTTP ${status}"

            case "$status" in
              2*) ;;
              429|502)
                if grep -Eqi 'quota exceeded|total query cost|rate.?limit|retry after' response.json; then
                  echo "TENNET Gmail quota reached; deferring this slice to the next scheduled run."
                  quota_deferred=1
                  break
                fi
                echo "TENNET backfill returned HTTP $status" >&2
                exit 1
                ;;
              *) echo "TENNET backfill returned HTTP $status" >&2; exit 1 ;;
            esac

            if [ "$tick" -lt 2 ]; then
              sleep 120
            fi
          done

          if [ "$quota_deferred" -eq 1 ]; then
            echo "TENNET historical recovery remains pending and will resume automatically."
          fi

          echo "TENNET followup drain after historical recovery"
          status="$(curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${runtime_token}" \
            --header "Accept: application/json" \
            --output followup-response.json \
            --write-out "%{http_code}" \
            "https://ubereats-claims-manager.vercel.app/api/v1/runtime/followup-worker" || true)"
          cat followup-response.json 2>/dev/null || true
          echo
          echo "TENNET followup drain HTTP ${status}"
          case "$status" in
            2*) ;;
            *) echo "TENNET followup drain returned HTTP $status" >&2; exit 1 ;;
          esac
