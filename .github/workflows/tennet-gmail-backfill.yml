name: TENNET Gmail history backfill

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tennet-gmail-backfill.yml'
      - 'backend/app/routes/runtime.py'
      - 'backend/app/services/gmail_inbound_sync_service.py'
      - 'backend/app/services/gmail_email_provider.py'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: tennet-gmail-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Drain Uber Gmail history continuously
        shell: bash
        run: |
          set -u

          for tick in $(seq 1 10); do
            echo "TENNET Gmail history tick ${tick}/10"

            oidc_json="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tennet-runtime")" || {
                echo "Unable to mint OIDC token for this tick" >&2
                if [ "$tick" -lt 10 ]; then sleep 120; fi
                continue
              }

            runtime_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_json")"
            echo "::add-mask::$runtime_token"

            status="$(curl --silent --show-error --request POST \
              --header "Authorization: Bearer ${runtime_token}" \
              --header "Accept: application/json" \
              --output response.json \
              --write-out "%{http_code}" \
              "https://ubereats-claims-manager.vercel.app/api/v1/runtime/gmail-backfill" || true)"

            cat response.json 2>/dev/null || true
            echo
            echo "TENNET Gmail history HTTP ${status}"

            if [ -f response.json ] && grep -q '"status":"complete"' response.json; then
              echo "Historical Gmail backfill is complete."
              break
            fi

            if [ "$tick" -lt 10 ]; then
              sleep 120
            fi
          done

      - name: Re-arm TENNET Gmail history backfill
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f response.json ] && grep -q '"status":"complete"' response.json; then
            echo "Backfill complete; no re-arm required."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tennet-gmail-backfill.yml/dispatches" \
            --data '{"ref":"main"}'
