name: TENNET Gmail history backfill

# PAUSED: historical mailbox recovery must not compete with live TENNET sends.
# The live Gmail sync and follow-up worker remain active. Re-enable historical
# recovery only after the live queue has drained.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tennet-gmail-backfill.yml'

permissions:
  contents: read

concurrency:
  group: tennet-gmail-history-backfill
  cancel-in-progress: true

jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Historical Gmail backfill paused
        run: echo "Historical Gmail backfill is paused to preserve Gmail quota for live TENNET sends."
