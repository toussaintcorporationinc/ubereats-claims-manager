name: TENNET Gmail history backfill

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/app/routes/runtime.py'
      - '.github/workflows/tennet-gmail-backfill.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tennet-gmail-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tennet-runtime")"
          runtime_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_json")"
          echo "::add-mask::$runtime_token"
          python - "$runtime_token" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          safe = {k: claims.get(k) for k in ("iss", "aud", "repository", "ref", "workflow_ref")}
          print("TENNET_OIDC_SAFE_CLAIMS=" + json.dumps(safe, sort_keys=True))
          PY
          echo "TENNET_RUNTIME_TOKEN=$runtime_token" >> "$GITHUB_ENV"

      - name: Backfill one Gmail day safely
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${TENNET_RUNTIME_TOKEN}" \
            --header "Accept: application/json" \
            --output response.json \
            --write-out "%{http_code}" \
            "https://ubereats-claims-manager.vercel.app/api/v1/runtime/gmail-backfill")"
          cat response.json
          case "$status" in
            2*) ;;
            *) echo "TENNET history backfill returned HTTP $status" >&2; exit 1 ;;
          esac
