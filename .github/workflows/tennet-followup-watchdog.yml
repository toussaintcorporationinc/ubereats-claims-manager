name: TENNET followup watchdog

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: tennet-followup-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure TENNET followup worker is alive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          runs_json="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tennet-followup-worker.yml/runs?branch=main&per_page=20")"

          active_count="$(python -c 'import json,sys; data=json.load(sys.stdin); active={"queued","in_progress","waiting","requested","pending"}; print(sum(1 for run in data.get("workflow_runs", []) if run.get("status") in active))' <<<"${runs_json}")"

          if [ "${active_count}" -gt 0 ]; then
            echo "TENNET followup worker is alive (${active_count} active/queued run(s))."
            exit 0
          fi

          echo "TENNET followup worker is not active. Restarting it."
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tennet-followup-worker.yml/dispatches" \
            --data '{"ref":"main"}'
