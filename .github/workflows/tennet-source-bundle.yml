name: TENNET source bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennet-source-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create TENNET source bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -czf tennet-source.tgz frontend backend vercel.json
      - uses: actions/upload-artifact@v4
        with:
          name: tennet-source
          path: tennet-source.tgz
          retention-days: 1
