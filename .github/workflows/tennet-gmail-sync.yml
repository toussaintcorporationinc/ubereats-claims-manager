name: TENNET Gmail sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tennet-gmail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run TENNET Gmail worker
        env:
          TENNET_CRON_SECRET: ${{ secrets.TENNET_CRON_SECRET }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${TENNET_CRON_SECRET}" \
            --header "Accept: application/json" \
            --output response.json \
            --write-out "%{http_code}" \
            "https://thetennet.com/api/v1/runtime/gmail-sync")"
          cat response.json
          case "$status" in
            2*) ;;
            *) echo "TENNET worker returned HTTP $status" >&2; exit 1 ;;
          esac
