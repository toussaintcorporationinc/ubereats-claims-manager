name: TENNET Gmail sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/app/routes/runtime.py'
      - '.github/workflows/tennet-gmail-sync.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tennet-gmail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tennet-runtime")"
          runtime_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_json")"
          echo "::add-mask::$runtime_token"
          echo "TENNET_RUNTIME_TOKEN=$runtime_token" >> "$GITHUB_ENV"

      - name: Run TENNET Gmail worker
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${TENNET_RUNTIME_TOKEN}" \
            --header "Accept: application/json" \
            --output response.json \
            --write-out "%{http_code}" \
            "https://ubereats-claims-manager.vercel.app/api/v1/runtime/gmail-sync")"
          cat response.json
          case "$status" in
            2*) ;;
            *) echo "TENNET worker returned HTTP $status" >&2; exit 1 ;;
          esac
