name: TENNET followup worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tennet-followup-worker.yml'

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: tennet-followup-worker
  cancel-in-progress: false

jobs:
  followups:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Run TENNET followups at Gmail-safe maximum pace
        shell: bash
        run: |
          set -u

          for tick in $(seq 1 10); do
            echo "TENNET followup tick ${tick}/10"

            oidc_json="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=tennet-runtime")" || {
                echo "Unable to mint OIDC token for this tick" >&2
                if [ "$tick" -lt 10 ]; then sleep 173; fi
                continue
              }

            runtime_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$oidc_json")"
            echo "::add-mask::$runtime_token"

            status="$(curl --silent --show-error --request POST \
              --header "Authorization: Bearer ${runtime_token}" \
              --header "Accept: application/json" \
              --output response.json \
              --write-out "%{http_code}" \
              "https://ubereats-claims-manager.vercel.app/api/v1/runtime/followup-worker" || true)"

            cat response.json 2>/dev/null || true
            echo
            echo "TENNET runtime HTTP ${status}"

            # The dedicated Gmail schedules can be delayed or missed by GitHub.
            # Use one bounded, authenticated recovery pass per followup run.
            # This does not send any message directly: the TENNET API applies
            # its own cooldown, deduplication and per-account Gmail limits.
            if [ "$tick" -eq 1 ]; then
              for lane in gmail-sync gmail-backfill; do
                # A successful live sync can exhaust the per-user Gmail query
                # budget for the current minute. Give it time to recover before
                # any historical batch; preserve Gmail send pacing and cooldowns.
                if [ "$lane" = "gmail-backfill" ]; then
                  sleep 120
                fi
                echo "TENNET Gmail recovery fallback: ${lane}"
                lane_status="$(curl --connect-timeout 10 --max-time 95 \
                  --silent --show-error --request POST \
                  --header "Authorization: Bearer ${runtime_token}" \
                  --header "Accept: application/json" \
                  --output "${lane}-response.json" \
                  --write-out "%{http_code}" \
                  "https://ubereats-claims-manager.vercel.app/api/v1/runtime/${lane}" || true)"
                cat "${lane}-response.json" 2>/dev/null || true
                echo
                echo "TENNET Gmail ${lane} HTTP ${lane_status}"
                if [[ ! "${lane_status}" =~ ^2 ]]; then
                  echo "TENNET ${lane} requires retry or inspection; continuing safe followup worker." >&2
                fi
              done
            fi

            if [ "$tick" -lt 10 ]; then
              sleep 173
            fi
          done

      - name: Re-arm TENNET followup worker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tennet-followup-worker.yml/dispatches" \
            --data '{"ref":"main"}'
