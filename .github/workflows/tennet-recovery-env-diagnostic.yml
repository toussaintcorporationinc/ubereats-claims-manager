name: TENNET recovery env token diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennet-recovery-env-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN_A: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_B: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_C: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_ORG_ID: team_6ANDQINhLaEu2qEjm70t7yZd
      VERCEL_PROJECT_ID: prj_DS4cMQkfJylLEcMGn8xjnk27O9Pn
    steps:
      - uses: actions/checkout@v4

      - name: Pull tennet-recovery production environment
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${VERCEL_TOKEN_A:-${VERCEL_TOKEN_B:-${VERCEL_TOKEN_C:-}}}"
          if [[ -z "$TOKEN" ]]; then
            echo "VERCEL_TOKEN_PRESENT=false"
            exit 2
          fi
          echo "VERCEL_TOKEN_PRESENT=true"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --token="$TOKEN" >/dev/null
          test -f .vercel/.env.production.local
          echo "RECOVERY_ENV_PULL=true"

      - name: Install diagnostic dependency
        run: python -m pip install --quiet "psycopg[binary]>=3.2,<4" python-dotenv

      - name: Verify tennet-recovery cipher key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, hmac, os, sys
          from dotenv import dotenv_values
          import psycopg

          env = dotenv_values(".vercel/.env.production.local")
          secret = str(env.get("SECRET_KEY") or "")
          db_url = str(env.get("DATABASE_URL") or env.get("POSTGRES_URL") or "")
          print("RECOVERY_SECRET_KEY_PRESENT=" + str(bool(secret)).lower())
          print("RECOVERY_DATABASE_URL_PRESENT=" + str(bool(db_url)).lower())
          if not secret or not db_url:
              sys.exit(3)

          db_url = db_url.replace("postgresql+psycopg://", "postgresql://", 1)
          key = hashlib.sha256(f"{secret}:token-cipher:v1".encode()).digest()

          def matches(value):
              if not value or not value.startswith("v1."):
                  return False
              raw = base64.urlsafe_b64decode(value.split(".", 1)[1].encode("ascii"))
              if len(raw) < 32:
                  return False
              nonce, tag, cipher = raw[:16], raw[16:32], raw[32:]
              expected = hmac.new(key, nonce + cipher, hashlib.sha256).digest()[:16]
              return hmac.compare_digest(tag, expected)

          with psycopg.connect(db_url, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT id, email_address, refresh_token_encrypted
                      FROM email_accounts
                      WHERE provider='gmail'
                        AND disconnected_at IS NULL
                        AND email_address IS NOT NULL
                      ORDER BY id
                  """)
                  rows = cur.fetchall()

          ok = 0
          for account_id, email, token in rows:
              result = matches(token)
              ok += int(result)
              print(f"RECOVERY_CIPHER_MATCH::{email}::{str(result).lower()}")
          print(f"RECOVERY_CIPHER_MATCH_COUNT={ok}")
          print(f"RECOVERY_ACTIVE_GMAIL_COUNT={len(rows)}")
          PY
