name: TENNET Gmail token cipher diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tennet-token-cipher-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL_1: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_2: ${{ secrets.DATABASE_URL_PRODUCTION }}
      DATABASE_URL_3: ${{ secrets.TENNET_DATABASE_URL }}
      DATABASE_URL_4: ${{ secrets.POSTGRES_URL }}
      DATABASE_URL_5: ${{ secrets.NEON_DATABASE_URL }}
      SECRET_KEY_VALUE: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install psycopg
        run: python -m pip install --quiet "psycopg[binary]>=3.2,<4"

      - name: Verify legacy Gmail token cipher key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, hmac, os, sys
          import psycopg

          secret = os.environ.get("SECRET_KEY_VALUE") or ""
          if not secret:
              print("SECRET_KEY_PRESENT=false")
              sys.exit(2)
          print("SECRET_KEY_PRESENT=true")

          db_url = next((os.environ.get(name) for name in (
              "DATABASE_URL_1","DATABASE_URL_2","DATABASE_URL_3","DATABASE_URL_4","DATABASE_URL_5"
          ) if os.environ.get(name)), "")
          if not db_url:
              print("DATABASE_URL_PRESENT=false")
              sys.exit(3)
          print("DATABASE_URL_PRESENT=true")
          db_url = db_url.replace("postgresql+psycopg://", "postgresql://", 1)

          key = hashlib.sha256(f"{secret}:token-cipher:v1".encode()).digest()

          def matches(value):
              if not value or not value.startswith("v1."):
                  return False
              try:
                  raw = base64.urlsafe_b64decode(value.split(".",1)[1].encode("ascii"))
              except Exception:
                  return False
              if len(raw) < 32:
                  return False
              nonce, tag, cipher = raw[:16], raw[16:32], raw[32:]
              expected = hmac.new(key, nonce + cipher, hashlib.sha256).digest()[:16]
              return hmac.compare_digest(tag, expected)

          with psycopg.connect(db_url, connect_timeout=10) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT id, email_address, refresh_token_encrypted
                      FROM email_accounts
                      WHERE provider='gmail' AND disconnected_at IS NULL
                      ORDER BY id
                  """)
                  rows = cur.fetchall()

          ok = 0
          for account_id, email, token in rows:
              result = matches(token)
              ok += int(result)
              safe_email = email or f"account-{account_id}"
              print(f"GMAIL_TOKEN_CIPHER_MATCH::{safe_email}::{str(result).lower()}")
          print(f"GMAIL_TOKEN_CIPHER_MATCH_COUNT={ok}")
          print(f"GMAIL_ACTIVE_ACCOUNT_COUNT={len(rows)}")
          PY
